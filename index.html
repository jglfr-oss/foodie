<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2F7A46">
<title>Foodie</title>
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Foodie">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root{
    --bg:#EEF3EA; --card:#FFFFFF; --ink:#1E2419; --ink2:#5F6B5A; --ink3:#98A394; --line:#E3EADF;
    --or:#F0761E; --or-soft:#FFE6D2; --gr:#2F7A46; --gr-soft:#DDF0E1; --danger:#C93B2E;
    --r:18px; --tap:52px;
    --font:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
  button{font-family:inherit}
  .app{max-width:600px;margin:0 auto;min-height:100vh;padding:0 0 120px}
  .top{background:var(--gr);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 0 18px;border-radius:0 0 28px 28px;margin-bottom:6px}
  .top .hd h1,.top .sec h2{color:#fff}
  .top .hd .date,.top .muted{color:rgba(255,255,255,.8)}
  .top .ib{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
  .top .day{box-shadow:0 2px 8px rgba(0,0,0,.12)}
  .top .day.empty{border-color:rgba(255,255,255,.45);color:rgba(255,255,255,.85)}
  .top .day.empty .plus{color:#fff}
  .top .day.today{box-shadow:0 6px 16px rgba(0,0,0,.25)}
  .top .pill{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
  .top .pill.or{background:var(--or);color:#fff}
  /* header */
  .hd{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 20px 6px}
  .hd h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1;color:var(--ink)}
  .hd h1 i{font-style:normal;color:var(--or)}
  .top .hd h1 i{color:#FFB077}
  .brand{display:inline-flex;margin-left:10px;vertical-align:middle}
  .brand span{width:26px;height:26px;border-radius:13px;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;margin-left:-7px;box-shadow:0 1px 2px rgba(0,0,0,.15);border:2px solid var(--gr)}
  .brand span:first-child{margin-left:0}
  .hd .date{font-size:14px;color:var(--ink2);font-weight:600;margin-top:6px}
  .ib{width:38px;height:38px;border-radius:19px;border:0;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08);display:inline-flex;align-items:center;justify-content:center;color:var(--ink2)}
  /* week strip */
  .sec{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 8px}
  .sec h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
  .sec .lnk{border:0;background:none;color:var(--or);font-weight:700;font-size:15px;padding:4px 0}
  .strip{display:flex;gap:10px;overflow-x:auto;padding:2px 20px 12px;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.55) rgba(0,0,0,.15)}
  .strip::-webkit-scrollbar{height:8px}.strip::-webkit-scrollbar-track{background:rgba(0,0,0,.15);border-radius:4px;margin:0 20px}.strip::-webkit-scrollbar-thumb{background:rgba(255,255,255,.55);border-radius:4px}
  .day.over{outline:3px dashed #fff;outline-offset:-3px;transform:scale(1.03)}
  .day[draggable]{cursor:grab}
  .drawer{margin:0 20px;background:rgba(255,255,255,.12);border-radius:16px;padding:10px 12px}
  .drawer .dh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;color:#fff;letter-spacing:.02em}
  .drawer .dh input{flex:1;margin:0 10px;height:34px;border:0;border-radius:10px;padding:0 10px;font:inherit;font-size:14px;background:rgba(255,255,255,.9)}
  .drawer .dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:150px;overflow:auto;scrollbar-width:thin}
  .drawer .dchips button{border:0;background:#fff;color:var(--ink);border-radius:16px;padding:7px 11px;font-size:13.5px;font-weight:700;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .drawer .dchips button.rc{background:var(--or-soft);color:#8a4410}
  .rcard{background:#fff;border-radius:var(--r);padding:14px 16px;margin:10px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;gap:12px;align-items:center}
  .rcard .tx{flex:1;min-width:0}.rcard h4{margin:0 0 2px;font-size:17px;font-weight:800}.rcard p{margin:0;color:var(--ink2);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rcard .go{border:0;background:var(--gr-soft);color:var(--gr);border-radius:12px;padding:9px 12px;font-weight:800;font-size:14px}
  .day{flex:0 0 132px;scroll-snap-align:start;background:var(--card);border-radius:var(--r);padding:12px 12px 12px;min-height:112px;display:flex;flex-direction:column;gap:6px;border:0;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative;color:var(--ink)}
  .day .dn{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
  .day .dn b{display:inline-block;width:8px;height:8px;border-radius:4px;background:var(--gr)}
  .day .mn{font-size:15.5px;font-weight:700;line-height:1.2;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .day .ct{font-size:12px;color:var(--ink2);font-weight:600}
  .day.today{background:var(--or);color:#fff;box-shadow:0 6px 16px rgba(240,118,30,.35)}
  .day.today .dn,.day.today .ct{color:rgba(255,255,255,.85)}
  .day.today .dn b{background:#fff}
  .day.empty{background:transparent;border:2px dashed #D9D3C4;box-shadow:none;justify-content:center;align-items:center;color:var(--ink3);font-weight:700}
  .day.empty .plus{font-size:30px;line-height:1;color:var(--or)}
  .pt{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:3px 8px;font-size:11.5px;font-weight:800;color:#fff;letter-spacing:.01em;white-space:nowrap}
  .pt.sm{font-size:10.5px;padding:2px 7px}
  .day .dn{align-items:center}
  .mix{display:flex;gap:6px;padding:0 20px 8px;flex-wrap:wrap}
  .mix .pt{opacity:.35}.mix .pt.on{opacity:1}
  .pillrow{display:flex;gap:8px;padding:4px 20px 6px;flex-wrap:wrap}
  .pill{border:0;background:#fff;border-radius:22px;padding:10px 14px;font-size:14px;font-weight:700;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.06);display:inline-flex;align-items:center;gap:6px}
  .pill.or{background:var(--or);color:#fff}
  .pill.gr{background:var(--gr-soft);color:var(--gr)}
  .pill:disabled{opacity:.5}
  /* list */
  .grp{margin:8px 20px 0}
  .grp .gh{display:flex;align-items:center;gap:8px;padding:12px 4px 6px;font-size:13px;font-weight:800;color:var(--gr);letter-spacing:.02em}
  .grp .gh .dot{width:10px;height:10px;border-radius:5px}
  .grp .gh .cnt{margin-left:auto;font-weight:600;color:var(--ink3)}
  .rows{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .it{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:6px 6px 6px 14px;border-bottom:1px solid var(--line);position:relative}
  .it:last-child{border-bottom:0}
  .ck{width:28px;height:28px;border-radius:14px;border:2px solid #D3D0C6;flex:none;display:flex;align-items:center;justify-content:center;background:#fff;transition:transform .12s,background .12s}
  .ck:active{transform:scale(.9)}
  .it.done .ck{background:var(--gr);border-color:var(--gr)}
  .it.done .nm{color:var(--ink3);text-decoration:line-through}
  .it .tx{flex:1;min-width:0;padding:6px 0}
  .it .nm{font-size:17px;font-weight:600}
  .it .nm .q{font-weight:700;color:var(--or);margin-left:6px;font-size:14px}
  .it .fr{font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:1px}
  .it .mr{width:44px;height:44px;border:0;background:none;color:var(--ink3);font-size:22px;border-radius:22px}
  .empty{margin:8px 20px;background:var(--card);border-radius:var(--r);padding:28px 20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .empty .ic{font-size:40px;margin-bottom:6px}
  .empty b{display:block;font-size:18px;margin-bottom:4px}
  .empty p{margin:0;color:var(--ink2);font-size:15px}
  .foot{padding:18px 20px 0;display:flex;flex-direction:column;gap:8px}
  /* FAB + tabbar */
  .fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:30px;background:var(--or);color:#fff;border:0;font-size:34px;line-height:1;box-shadow:0 8px 20px rgba(240,118,30,.4);z-index:6;display:flex;align-items:center;justify-content:center}
  .fab:active{transform:scale(.94)}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));display:flex}
  .tabs button{flex:1;border:0;background:none;color:var(--ink3);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
  .tabs button svg{width:26px;height:26px}
  .tabs button.on{color:var(--gr)}
  .tabs .bd{position:absolute;top:-3px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--or);color:#fff;font-size:11px;font-weight:800;line-height:18px}
  /* sheets */
  .veil{position:fixed;inset:0;background:rgba(30,36,25,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
  .sheet{background:#F5F8F3;width:100%;max-width:600px;border-radius:24px 24px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s cubic-bezier(.2,.8,.2,1)}
  .sheet .grab{width:38px;height:5px;border-radius:3px;background:#D9D3C4;margin:0 auto 14px}
  .sheet h3{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.02em}
  .sheet .sub{color:var(--ink2);font-size:14px;margin:0 0 14px}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.veil,.sheet{animation:none}}
  .in{width:100%;height:var(--tap);font:inherit;font-size:18px;padding:0 16px;border:0;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
  .in:focus{outline:0;box-shadow:inset 0 0 0 2px var(--or)}
  textarea.in{height:auto;min-height:96px;padding:12px 16px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .chip{border:0;background:#fff;border-radius:20px;padding:9px 13px;font-size:14px;font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .chip.have{background:var(--gr-soft);color:var(--gr)}
  .chip.sale{background:var(--or-soft);color:var(--or)}
  .chip.on{background:var(--or);color:#fff}
  .chip.tag{background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);font-weight:500}
  .btn{width:100%;min-height:var(--tap);border:0;border-radius:14px;background:var(--or);color:#fff;font-size:17px;font-weight:800;margin-top:8px}
  .btn.sec{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
  .btn.gr{background:var(--gr)}
  .btn.dng{background:none;color:var(--danger);box-shadow:none}
  .btn:disabled{opacity:.5}
  .split{display:flex;gap:8px}
  .split .btn{margin-top:8px}
  .kv{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:12px 16px;margin:8px 0;font-weight:600}
  .kv small{display:block;color:var(--ink2);font-weight:500;font-size:13px;margin-top:2px}
  .sw{width:50px;height:30px;border-radius:15px;background:#D3D0C6;position:relative;border:0;flex:none}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .sw.on{background:var(--gr)}.sw.on::after{transform:translateX(20px)}
  .card{background:#fff;border-radius:var(--r);padding:14px 16px;margin:10px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card h4{margin:0 0 3px;font-size:17px;font-weight:800}
  .card p{margin:0;color:var(--ink2);font-size:14px}
  .seg{display:flex;background:#DCE7D8;border-radius:14px;padding:3px;margin:12px 20px 8px}
  .seg button{flex:1;border:0;background:none;padding:10px 4px;font-size:14px;font-weight:700;color:var(--ink2);border-radius:11px}
  .seg button.on{background:var(--gr);color:#fff}
  .muted{color:var(--ink2);font-size:14px;margin:6px 20px}
  .deal{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600}
  .deal:last-child{border-bottom:0}
  .deal b{color:var(--or)}
  .stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 20px}
  .stat div{background:#fff;border-radius:var(--r);padding:12px 14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;color:var(--gr)}
  .stat small{color:var(--ink2);font-weight:600;font-size:12.5px}
  .bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding:0 4px}
  .bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
  .bars i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--gr);min-height:2px}
  .bars i.w{background:var(--or)}
  .bars span{font-size:10px;color:var(--ink3);font-weight:700}
  .bars em{font-style:normal;font-size:10px;color:var(--ink2);font-weight:700}
  .hbar{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600}
  .hbar:last-child{border-bottom:0}
  .hbar .l{flex:0 0 46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hbar .t{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
  .hbar .t i{display:block;height:100%;border-radius:5px;background:var(--or)}
  .hbar .v{flex:0 0 auto;color:var(--ink2);font-size:13px;min-width:44px;text-align:right}
  .legend{display:flex;gap:14px;font-size:12px;font-weight:700;color:var(--ink2);padding:6px 4px 0}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:4px;vertical-align:middle}
  input[type=file]{display:none}
  /* shopping mode */
  .shopwrap{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto;padding:0 0 calc(110px + env(safe-area-inset-bottom))}
  .shopwrap .hd h1{font-size:28px}
  .prog{margin:-6px 20px 8px;height:8px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden}
  .prog i{display:block;height:100%;background:var(--or);border-radius:4px;transition:width .2s}
  .shopwrap .it{min-height:70px;padding:10px 10px 10px 16px}
  .shopwrap .ck{width:36px;height:36px;border-radius:18px}
  .shopwrap .nm{font-size:21px}
  .shopwrap .mr{display:none}
  .shopbar{position:fixed;left:0;right:0;bottom:0;z-index:31;padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:rgba(238,243,234,.95);backdrop-filter:blur(10px);display:flex;gap:8px;max-width:600px;margin:0 auto}
  .toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center;z-index:40}
  .toast.show{opacity:1}
  :focus-visible{outline:2px solid var(--or);outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<button class="fab" id="fab" onclick="openAdd()" aria-label="Add item">+</button>
<div class="tabs" id="tabs"></div>
<div id="layer"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= data ================= */
const AISLES=[["Produce","#2F7A46"],["Meat & seafood","#C94A5A"],["Dairy & eggs","#E0A81E"],["Bakery","#B07A3C"],["Frozen","#3B7DD8"],["Pantry","#F0761E"],["Snacks & drinks","#8A5BD6"],["Household","#7C8A80"],["Other","#A2A69B"]];
const AN=AISLES.map(a=>a[0]); const AC=Object.fromEntries(AISLES);
const TIERS=[
 ["Dairy & eggs",["plant butter","oat milk","oatmilk","almond milk","cashew milk","yogurt","vegan cheese","dairy free cheese","dairy-free cheese"]],
 ["Snacks & drinks",["tortilla chips","potato chips","kettle chips","tea bags","herbal tea","fruit bowls","fruit cups","fruit snacks"]],
 ["Produce",["lettuce","guacamole","salad kit","bagged salad","fresh herbs","clamshell"]],
 ["Frozen",["frozen","steamable","steam in bag","steam-in-bag","ice cream","frozen dessert","fries","tater","crowns","cookie dough","potstickers","pizza dough","burrito","waffles","ice pops","popsicles"]],
 ["Household",["toilet paper","paper towels","paper towel","napkins","plates","paper cups","plastic cups","solo cups","wipes","freezer bags","storage bags","zipper bags","zipper","trash bags","foil","detergent","dryer sheets","softening","dish soap","hand wash","body wash","soap","sponge","scrubber","swiffer","cleaner","disinfectant","spray","shampoo","conditioner","toothpaste","toothbrush","floss","deodorant","lotion","razor","pads","tampons","lip","balm","vitamin","allergy","tablets","swabs","bandage","batteries","light bulb","led","cottonelle","charmin","chinet","huggies","diapers","medicine","relief","covid","flowers","plant","pot"]],
 ["Pantry",["broth","stock","gravy","sauce","salsa","ketchup","mayonnaise","mayo","mustard","dressing","paste","canned","oz can","oil","vinegar","flour","sugar","rice","pasta","noodles","penne","shells","macaroni","cereal","oatmeal","oats","powder","cumin","oregano","cinnamon","spice","seasoning","seasonings","salt","beans","chickpeas","lentils","tuna","peanut butter","hummus","pickles","water chestnuts","olives","bars","mix","gum","syrup","honey","aminos","coconut milk","taco dinner kit","taco kit","taco shells","diced tomatoes","crushed tomatoes","tomato sauce","tomato paste","panko","crumbs","sesame","tahini","sriracha","hoisin","fish sauce","curry","enchilada","jam","jelly","nutella","granola","kernel corn","nuts","almonds","raisins","dried"]],
 ["Snacks & drinks",["chips","popcorn","candy","cookies","cookie","chocolate","soda","coke","sprite","root beer","juice","sparkling water","spring water","water","bubly","olipop","coffee","k-cup","tea","crackers","pretzels","fruit bowls","fruit cups","pocky","m&m","nerds","skittles","oreo","doritos","cheetos","uncrustables","monster","capri sun","seltzer","lemonade","biscuit","gummies","gummy","reese's","hershey","cadbury","larabar","kind"]],
 ["Bakery",["bread","buns","bun","rolls","tortillas","tortilla","pita","bagels","naan","loaf","cake","muffins","croissant","brioche"]],
 ["Dairy & eggs",["milk","cheese","stringles","butter","yogurt","eggs","cream","parmesan","mozzarella","cheddar","feta","tortellini","ravioli","pierogies","dumplings","tzatziki","dip","shreds","creamer","kefir","half & half"]],
 ["Meat & seafood",["chicken","beef","pork","steak","steaks","sausage","bacon","shrimp","salmon","mahi","fish","turkey","hot dogs","meatballs","ham","roast","brisket","lamb","ribs","tenderloin","loin","applegate","deli","prosciutto","crab","rotisserie","wings","thighs","breast","drumsticks","cod","tilapia","scallops","ground beef","ground pork","ground turkey"]],
 ["Produce",["onion","onions","green onion","garlic","tomato","tomatoes","potato","potatoes","sweet potato","pepper","peppers","jalapenos","jalapeno","cilantro","lime","limes","lemon","lemons","apple","apples","banana","bananas","broccoli","carrot","carrots","celery","mushroom","mushrooms","portobello","portabella","spinach","avocado","avocados","ginger","herbs","salad","cabbage","cucumber","berries","strawberries","blueberries","raspberries","fruit","zucchini","squash","scallions","romaine","kale","corn","grapes","orange","oranges","pear","pears","slaw","basil","parsley","bok choy","chives","mint","beets","asparagus","melon","pineapple","mango","peaches","cherries","plums","kiwi","dill","thyme","rosemary","sprouts","greens","produce"]]

const SEED_RECIPES=[{"name":"Instant Pot beef stew","url":"https://www.dinneratthezoo.com/instant-pot-beef-stew/","serves":6,"ingredients":["1 tbsp olive oil","2½ lb beef stew meat","Salt and pepper","1 onion, diced","2 tsp minced garlic","1 lb small yellow potatoes, quartered","4 carrots, cut in 1-inch pieces","3 cups beef broth","3 tbsp tomato paste","1 tsp dried thyme","1 bay leaf","1 cup frozen peas","3 tbsp flour","2 tbsp chopped parsley","Worcestershire sauce (our add)"],"steps":"1. Instant Pot on Sauté (More). Add oil once hot.\n2. Brown half the meat, seasoned with salt and pepper, 3–4 min per side. Remove; repeat with the rest.\n3. Return all meat with onion, garlic, potatoes, carrots, broth, tomato paste, thyme, bay leaf, salt and pepper. Add a splash of Worcestershire.\n4. Stir, seal, Manual High Pressure 30 min. Release pressure.\n5. Remove 1/3 cup liquid, whisk in flour until smooth, pour back in and simmer on Sauté 3–5 min until thickened.\n6. Stir in peas and parsley.","id":"r3006fda"},{"name":"1770 House meatloaf with garlic sauce","url":"","serves":8,"ingredients":["2 tbsp olive oil","2 cups chopped Spanish onion (1 large)","1½ cups small-diced celery (2 stalks)","1 lb ground beef","1 lb ground veal","1 lb ground pork","1 tbsp chopped flat-leaf parsley","1 tbsp chopped fresh thyme","1 tbsp chopped chives","3 extra-large eggs, beaten","⅔ cup whole milk","2 tbsp kosher salt","1 tbsp black pepper","2½ cups panko","Garlic sauce: ¾ cup olive oil, 10 garlic cloves peeled, 2 cups chicken stock, 3 tbsp unsalted butter, salt and pepper"],"steps":"Barefoot Contessa Foolproof.\n1. Oven 350°F. Sauté onion and celery in oil 5–7 min until translucent; cool slightly.\n2. Mix beef, veal, pork, parsley, thyme, chives, eggs, milk, salt, pepper in a big bowl. Grind panko fine in a food processor.\n3. Add onion mix and panko to meat; toss gently with clean hands — combined, not compacted.\n4. Parchment on a sheet pan. Pat into a flat rectangle, press sides in to form a cylinder (no air pockets). Bake 40–50 min to 155–160°F. Rest 10 min.\nGarlic sauce: boil oil and garlic in a small pan, simmer 10–15 min until lightly browned (don't burn). Remove garlic, save oil. Boil stock, butter and garlic in a medium pan; full boil 35–40 min until slightly thickened. Mash garlic with a fork, whisk in ½ tsp salt and ¼ tsp pepper. Spoon warm over slices.","id":"rf659fda"},{"name":"Instant Pot Mississippi pot roast","url":"","serves":8,"ingredients":["2 tbsp canola oil","3 lb boneless chuck roast, trimmed","1½ tsp kosher salt","1 tsp black pepper","2 medium red onions (10 oz each), quartered","3 medium garlic cloves","1 cup jarred pepperoncini + 2 tbsp liquid from the jar","¼ cup beef broth","2 tbsp unsalted butter","1 (1 oz) envelope ranch dressing mix","1 tbsp chopped fresh dill","1 tbsp chopped fresh chives","Mashed potatoes, egg noodles or rice, for serving"],"steps":"Southern Living.\n1. Sauté on high, preheat, add oil. Pat roast dry, salt and pepper all sides. Brown, turning often, 10 min. Remove. Onions and garlic, stir and scrape 2 min. Cancel. Add roast, peppers, broth, butter and ranch mix.\n2. Lid on, sealing. Manual/pressure cook, high, 55 min (8–10 min to come to pressure).\n3. Natural release 10–12 min. Roast to a platter; stir the 2 tbsp pepper liquid into the juices. Onion mixture on the roast, juices over, dill and chives on top.\nSlow cooker: sear on the stove, everything in the cooker, LOW 8–9 hr or HIGH 5–6.","id":"r3cf515d"},{"name":"Moroccan roast (slow cooker or Instant Pot)","url":"https://fitslowcookerqueen.com/slow-cooker-instant-pot-moroccan-pot-roast/","serves":4,"ingredients":["2–3 lb beef or lamb roast","¾ lb potatoes or sweet potatoes, chopped","15 oz can diced tomatoes with juice","15 oz can chickpeas, drained","½ cup low-sodium beef or bone broth","1 small onion, sliced","2 tsp oil","Rub: 1 tsp each ginger, cumin, turmeric, paprika, red pepper flakes","Rub: ½ tsp each cinnamon, coriander, nutmeg, cloves, salt, pepper"],"steps":"Slow cooker: (optional) press the rub on the roast and sear 2–3 min per side for bark. Add tomatoes, onion, chickpeas, broth to the cooker. Season roast with the rub, add it. HIGH 4–5 hr or LOW 8–9.\nInstant Pot: season roast with rub. Sauté with oil, sear a few minutes per side, remove. Cook onion and garlic until soft; pour in broth and tomatoes and deglaze. Return roast. Seal, High Pressure 15 min per pound. Natural release.","id":"r84a4caf"},{"name":"Grilled beef satay with peanut sauce","url":"","serves":4,"ingredients":["1½ lb flank steak","6 tbsp vegetable oil","1½ tbsp fish sauce","1½ tbsp soy sauce","3 tbsp packed dark brown sugar","2 garlic cloves","Zest of 1 lime","¾ tsp crushed red pepper flakes","1 tsp ground coriander","1 tsp ground cumin","1 tsp ground ginger","Peanut sauce: ¾ cup coconut milk, ¼ cup creamy peanut butter, 3 tbsp dark brown sugar, 1 tbsp Thai red curry paste, 1 tbsp Sriracha, 1 tbsp fish sauce, 2 tbsp lime juice","Skewers (24 short or 12 long)"],"steps":"1. Peanut sauce: whisk everything in a small saucepan over high heat, boil, then simmer ~3 min until slightly thick. Set aside (thickens as it cools).\n2. Slice flank steak against the grain, ¼ inch thick (freeze 10–15 min first to make slicing easy).\n3. Blend the remaining marinade ingredients until smooth and thick; toss with the steak.\n4. Thread onto skewers on a foil-lined sheet; pour leftover marinade over.\n5. Grill on high, oiled grates, covered, 1–2 min per side until browned outside, pink inside. Serve with the sauce. Broiler or grill pan works too.","id":"r8c0ea94"},{"name":"Beef veg soup","url":"","serves":6,"ingredients":["1 lb lean ground beef","1 onion, diced","2 cloves garlic, minced","2 medium potatoes, peeled and diced","3½ cups beef broth (or 4 cups if skipping the water below)","28 oz can diced tomatoes with juice","3 tsp tomato paste + 6 oz water (our sub for the can of condensed tomato soup)","2 tsp Worcestershire sauce","1 tsp Italian seasoning","1 bay leaf","Salt and pepper","3 cups frozen mixed vegetables"],"steps":"1. Brown onion, ground beef and garlic until no pink remains. Drain fat.\n2. Add potatoes, broth, tomatoes, tomato paste and water, Worcestershire, seasoning and bay leaf. Simmer covered 10 min.\n3. Stir in vegetables. Simmer 15–20 min until potatoes are tender.","id":"r1d0eddf"},{"name":"Asian lettuce wraps","url":"","serves":4,"ingredients":["16 Boston Bibb or butter lettuce leaves","1 lb lean ground beef","1 tbsp cooking oil","1 large onion, chopped","2 cloves garlic, minced","1 tbsp soy sauce","¼ cup hoisin sauce","2 tsp minced pickled ginger","1 tbsp apple cider vinegar (our sub for rice wine vinegar)","Asian chile pepper sauce (optional)","1 (8 oz) can water chestnuts, drained and chopped","1 bunch green onions, chopped","2 tsp dark sesame oil"],"steps":"1. Rinse whole lettuce leaves, pat dry.\n2. Brown beef in oil over high heat; drain and set aside. Cook onion in the same pan. Add garlic, soy, hoisin, ginger, vinegar and chile sauce; stir. Stir in water chestnuts, green onions, sesame oil and beef; cook until onions just wilt, ~2 min.\n3. Serve meat in the center of a platter ringed with lettuce; wrap like a burrito.","id":"r6d5bbdd"},{"name":"Grilled chicken with herbs","url":"","serves":6,"ingredients":["1½ lb boneless skinless chicken breasts","2 tbsp chopped flat-leaf parsley","2 tsp fresh rosemary, minced","2 tsp chopped fresh thyme","1 tsp dried sage","3 cloves garlic, minced","¼ cup olive oil","½ cup balsamic vinegar","Salt and pepper"],"steps":"1. Blend parsley, rosemary, thyme, sage, garlic, oil, vinegar, salt and pepper. Pour over chicken in a glass dish; marinate 2–48 hr.\n2. Grill medium-high or broil.\n3. Discard marinade; grill 6–7 min per side until cooked through.","id":"r27cb7ba"},{"name":"Chinese curry chicken","url":"https://dinnerthendessert.com/chinese-curry-chicken/","serves":4,"ingredients":["1 lb boneless skinless chicken breasts","2 tbsp soy sauce","1 tbsp cornstarch","3 tbsp canola oil","1 tbsp curry powder","2 carrots, sliced ¼ inch","1 green bell pepper, sliced","½ yellow onion, sliced","1 tsp sesame oil","1 tsp sugar"],"steps":"1. Slice chicken thin (matchbook size). Toss with soy sauce and cornstarch.\n2. Heat oil in a wok on medium-high. Add curry powder, stir ~5 seconds until fragrant.\n3. Add chicken with marinade; cook a couple of minutes, then add carrots, pepper and onion.\n4. Cook 2–3 more min until veg are barely soft and chicken is done. Add sesame oil and sugar, 30 seconds more.","id":"r98800d3"},{"name":"Crock-Pot chicken tikka masala","url":"","serves":6,"ingredients":["2 lb chicken breasts, 1½-inch chunks","1 large onion, finely chopped","4 garlic cloves, minced","2 tbsp grated fresh ginger","1 (29 oz) can tomato sauce","2 tbsp olive oil","1 tbsp garam masala","2 tsp ground cumin","2 tsp ground coriander","2 tsp paprika","1 tsp turmeric","½ tsp cinnamon","½ tsp cayenne","½ tsp black pepper","1 bay leaf","1 cup heavy cream or full-fat coconut milk","2 tbsp arrowroot powder or cornstarch","Juice of ½ lemon"],"steps":"1. Grease the crock. Combine everything except bay leaf, cream, arrowroot and lemon in a bowl; coat the chicken well.\n2. Pour in, bay leaf on top. LOW 8 hr or HIGH 4 hr.\n3. Whisk cream with arrowroot, stir in, cook 20 min more to thicken.\n4. Stir in lemon juice. Keeps 5 days.","id":"rf667ca2"},{"name":"Chunky chicken noodle soup","url":"","serves":6,"ingredients":["½ cup diced carrot","¼ cup diced celery","¼ cup chopped onion","1 tsp butter","6 cups chicken broth","1½ cups diced cooked chicken","1 tsp salt","½ tsp dried marjoram","½ tsp dried thyme","⅛ tsp pepper","1¼ cups uncooked medium egg noodles","1 tbsp minced fresh parsley"],"steps":"1. Sauté carrot, celery and onion in butter until tender. Add broth, chicken and seasonings; bring to a boil. Reduce heat, add noodles, cook 10 min or until tender. Add parsley.","id":"rbc02bfd"},{"name":"Sheet pan chicken shawarma","url":"","serves":4,"ingredients":["6 boneless skinless chicken thighs","1 tbsp avocado or olive oil","1 tbsp ground cumin","1 tbsp paprika","1 tsp turmeric","1 tsp ground allspice","¼ tsp cinnamon","2 sweet bell peppers","1 red onion","Sea salt"],"steps":"1. Oven 425°F.\n2. Slice thighs into ½-inch strips; toss on a sheet pan with the oil.\n3. Add the spices and toss to coat.\n4. Roast 15 min while slicing peppers and onion; add them and roast ~10 min more until chicken is done and veg are soft.","id":"ra17a44f"},{"name":"Grilled chicken souvlaki with dairy-free tzatziki","url":"https://downshiftology.com/recipes/grilled-chicken-souvlaki-dairy-free-tzatziki/","serves":4,"ingredients":["4 boneless skinless chicken breasts","⅓ cup olive oil","2 tbsp fresh lemon juice","3 cloves garlic, minced","2 tsp dried oregano","1 tsp dried parsley","1 tsp sea salt","½ tsp pepper","Tzatziki: 1 cup raw cashews (soaked 4–6 hr), ½ cup water, ¼ cup lemon juice, ½ cup cucumber peeled and diced, 2 cloves garlic, 2 tbsp fresh dill, 1 tsp sea salt","Pita, tomatoes and cucumber for serving (next time!)"],"steps":"1. Chop chicken into 1½-inch chunks; stir with the remaining souvlaki ingredients and marinate at least 30 min.\n2. Tzatziki: blend soaked cashews, water, lemon juice, garlic and salt until smooth; stir in cucumber and dill.\n3. Thread chicken on skewers; grill medium-high ~4 min per side until cooked through.\n4. Serve in pita with tomatoes and cucumber and the tzatziki.","id":"rd890f3a"},{"name":"Singapore noodles","url":"https://omnivorescookbook.com/singapore-noodles/","serves":2,"ingredients":["4 oz dried rice vermicelli","Cilantro for garnish","Sauce: 2 tbsp Shaoxing wine (or dry sherry), 1 tbsp soy sauce, 2 tsp curry powder (1 tbsp for spicier), 1 tsp salt, ½ tsp sesame oil, ½ tsp sugar, ⅛ tsp white pepper","2 tbsp peanut or vegetable oil","2 large eggs, beaten","½ lb shrimp, peeled","½ lb ground pork (or char siu or ham)","½ small onion, sliced","2 cloves garlic, minced","2 tsp minced ginger","1 bell pepper, thinly sliced"],"steps":"1. Soak noodles in boiling water per package; drain.\n2. Mix sauce ingredients.\n3. Scramble eggs in ½ tbsp oil; plate.\n4. Cook pork in ½ tbsp oil, breaking up; plate with egg.\n5. Remaining oil: onion, garlic, ginger 2–3 min. Add shrimp and pepper, cook until shrimp turn white.\n6. Add noodles and sauce, then egg and pork back in; toss with tongs. Serve immediately with cilantro. Serves 2 — double it.","id":"r8d02165"},{"name":"Tosco's copycat chicken","url":"","serves":4,"ingredients":["2 lb chicken","⅓ cup olive oil","3 tbsp lemon juice","3 tbsp soy sauce","2 tbsp balsamic vinegar","¼ cup brown sugar","1 tbsp Worcestershire sauce","½ tsp garlic powder","1½ tsp salt","1 tsp pepper"],"steps":"1. Whisk the marinade. Pierce the chicken with a fork.\n2. Marinate 3–4 hours. Grill.","id":"rf88e99d"},{"name":"Chicken with wild mushrooms","url":"","serves":6,"ingredients":["2 (3½–4 lb) chickens, cut in eighths","Kosher salt and pepper","All-purpose flour","½ cup olive oil","8 whole garlic cloves","1½ lb wild mushrooms (porcini, cremini), diced","8 sprigs fresh thyme, tied","¼ cup dry sherry","1 tbsp minced garlic (3 cloves)","2 cups white wine (Pinot Grigio)","2 cups chicken stock","3 tbsp unsalted butter, room temp"],"steps":"Barefoot Contessa Foolproof, p.118.\n1. Oven 325°F. Pat chicken dry, salt and pepper both sides, dredge in ½ cup flour. Brown in oil in a 12-inch ovenproof pot in three batches, 3–5 min per side. Remove.\n2. Add whole garlic, mushrooms and thyme; cook 5 min. Add sherry and minced garlic, cook 1 min. Add wine and stock, bring to a boil.\n3. Return chicken, cover, bake 30–40 min until cooked through.\n4. Remove thyme. Mash butter with 1½ tbsp flour, whisk in, simmer a few minutes until the sauce thickens. Serve over couscous.","id":"rf6d81df"},{"name":"Skillet chicken salad pitas","url":"","serves":8,"ingredients":["2 lb boneless skinless chicken breasts, 1-inch pieces","⅓ cup snipped fresh cilantro","¼ cup Asian sweet chili sauce","2 tbsp lime juice","1 tbsp minced garlic","1 tsp olive oil","⅛ tsp kosher salt","1 large red sweet pepper, strips","Dressing: ⅔ cup mayonnaise, ½ cup snipped cilantro, 2 tbsp lime juice","8 pita rounds","8 leaves red or green leaf lettuce"],"steps":"1. Bag: ⅓ cup cilantro, chili sauce, 2 tbsp lime juice, garlic, oil, salt. Add chicken, marinate 1 hr.\n2. Cook chicken in a 12-inch skillet, half at a time, 3 min per batch. Return all, add pepper, cook 5 min more. Chill 1–8 hr.\n3. Dressing: mayo, ½ cup cilantro, 2 tbsp lime juice. Lettuce on pita, chicken on half, drizzle dressing.","id":"rc4d48ac"},{"name":"Chicken and broccoli stir-fry","url":"https://www.foodnetwork.com/recipes/food-network-kitchen/chicken-and-broccoli-stir-fry-recipe-1942670","serves":4,"ingredients":["1 lb chicken breast, cubed","3 scallions, whites only, sliced","1–2 tbsp sugar (we go lighter)","1 tbsp dark sesame oil","1 tbsp dry sherry","1 tbsp soy sauce","2 cloves garlic, minced","1-inch piece ginger, minced","1 tbsp + 1 tsp cornstarch","Kosher salt and pepper","About ⅓ cup water","3 tbsp vegetable oil","5–6 cups broccoli florets and sliced stalks (keep separate)","¾–1 tsp red chili flakes (optional)","1 tbsp hoisin sauce","Toasted sesame seeds and jasmine rice, for serving"],"steps":"1. Toss chicken with scallion whites, sugar, sesame oil, sherry, soy, half the garlic, half the ginger, 1 tsp cornstarch and 1 tsp salt. Marinate 15 min. Mix remaining 1 tbsp cornstarch with ⅓ cup water; reserve.\n2. Big nonstick skillet on high, 1 tbsp oil. Broccoli stems 30 sec, then florets, remaining garlic and ginger, 2 tbsp water, ¼ tsp salt, pepper. Stir-fry ~2 min until bright green but crisp. Plate.\n3. Skillet hot again, remaining 2 tbsp oil. Chicken and chili flakes, stir-fry ~3 min until a little brown. Add hoisin, return broccoli, toss. Stir in the cornstarch mix and boil to thicken; thin with water if needed.\n4. Sesame seeds on top; serve with rice.","id":"r6e4c7df"},{"name":"Chicken and dumplings","url":"https://www.mamaknowsglutenfree.com/gluten-free-chicken-dumplings/","serves":6,"ingredients":["3–4 cups cooked chicken, diced (rotisserie)","4 cups gluten-free chicken broth","2 cups frozen mixed vegetables","Potatoes, diced (our add)","1 tbsp dried sage","1 tbsp dried thyme","1 tbsp onion powder","½ tsp salt","2 cups milk (or cashew/coconut/almond milk)","6 tbsp cornstarch","Dumplings: 1½ cups Bisquick Gluten Free","2 eggs, whisked","⅔ cup milk (or dairy-free)","4 tbsp unsalted butter, melted (or Earth Balance)"],"steps":"1. Large pot: broth, chicken, frozen veg, potatoes, sage, thyme, onion powder, salt. Bring to a low boil over medium.\n2. Stir milk and cornstarch until dissolved; pour into the pot, stir, keep boiling.\n3. Whisk eggs; stir in Bisquick, milk and melted butter until just combined.\n4. Drop tablespoons of dough onto the boiling soup. Cover, reduce to a simmer, cook 15 min without lifting the lid, until dumplings are cooked through.","id":"reb6bf33"},{"name":"Chicken fried rice","url":"","serves":4,"ingredients":["1 cup jasmine rice","1 tbsp vegetable oil","2 tbsp sesame oil","2 chicken breasts (about 1 lb), ½-inch pieces","1 tbsp soy sauce","1 tsp kosher salt","1 tsp black pepper","½ cup fresh or frozen peas","½ cup diced carrots","½ cup diced yellow onion","5 garlic cloves, minced","2 large eggs","¼ cup hoisin sauce","1 tsp grated fresh ginger","3 tbsp sliced green onions"],"steps":"1. Rinse rice until the water runs clear. Boil 2 cups water, add rice, simmer covered 12 min, rest 5–10 min off heat. Spread on a sheet pan to cool (or make it a day ahead — keeps it from going mushy).\n2. Wok on medium-high: vegetable oil + 1 tbsp sesame oil. Chicken, soy, salt, pepper; stir constantly 10–12 min until dark golden. Slotted spoon into a bowl.\n3. Remaining 1 tbsp sesame oil: peas, carrots, onion ~4 min; garlic 1 min more. Into the chicken bowl.\n4. Scramble eggs in the wok 1–2 min. Add chicken, veg, cooled rice, hoisin and ginger; stir until hot. Top with green onions.","id":"rb6e8baf"},{"name":"Asian chicken soup","url":"https://thecleaneatingcouple.com/asian-chicken-soup/","serves":4,"ingredients":["1 tbsp olive oil","1 lb chicken thighs or breasts (or a rotisserie chicken, shredded)","1 cup onion, finely chopped","2 tbsp minced garlic (5 cloves)","2 cups carrots, sliced","1 tsp fresh ginger","2 quarts unsalted chicken broth (8 cups)","2 tbsp coconut aminos","8 oz brown rice ramen noodles","2 cups baby bok choy, chopped","¼ tsp red pepper flakes (optional)","½ tsp sesame oil, at the end (instead of the rice wine vinegar)"],"steps":"Our version: rotisserie chicken, skip the rice wine vinegar, sesame oil at the end.\n1. Sauté onion, garlic, carrots and ginger in oil 3–5 min.\n2. Add broth, aminos, pepper flakes (and raw chicken if using). Simmer 20 min; shred chicken.\n3. Cook noodles separately per package (keeps them from soaking up the broth).\n4. Stir bok choy and shredded chicken into the soup for the last 2–3 min. Finish with ½ tsp sesame oil. Noodles in bowls, ladle soup over.","id":"r7df2d80"},{"name":"Pressure cooker butter chicken","url":"","serves":6,"ingredients":["4 tbsp dairy-free buttery spread","1 cup chopped sweet onion","3 tbsp jarred minced garlic","2 tbsp jarred minced ginger","1 tbsp curry powder","2 tsp garam masala","1 tsp salt","¾ tsp smoked paprika","2 lb boneless skinless chicken thighs, 1-inch pieces","1 (15 oz) can tomato sauce","1 cup full-fat canned coconut milk","¼ cup chopped cilantro"],"steps":"1. Buttery spread, onion, garlic, ginger and all spices in the pot. Sauté 5 min, stirring. Cancel.\n2. Add chicken and tomato sauce. Lid on, sealing. Manual 7 min.\n3. Quick release.\n4. Stir in coconut milk; Sauté 2 min to thicken. Cilantro on top. Rice or naan.","id":"r37583ca"},{"name":"Skirt steak marinade with chimichurri","url":"","serves":4,"ingredients":["Marinade: ½ cup olive oil","⅓ cup fresh orange juice","⅓ cup fresh lime juice","¼ cup soy sauce","¼ cup Worcestershire sauce","2 tbsp apple cider vinegar","4 garlic cloves, minced","1 lb skirt steak (or chicken — we've doubled it and used chicken)","Salt and pepper","Chimichurri: 1 cup fresh parsley","1 cup fresh cilantro","¼ cup olive oil","½ medium onion","2 garlic cloves","3 tbsp lime juice","2 tbsp red wine vinegar","½ tsp salt","½ tsp pepper","¼ tsp red pepper flakes (optional)"],"steps":"(Page was blurry — amounts are my best read; check the binder.)\nOur note: doubled the marinade, marinated chicken in half of it, spooned the rest over the cooked chicken.\n1. Whisk marinade; marinate steak (or chicken) 1–4 hr.\n2. Chimichurri: pulse everything in a food processor until chopped but not smooth.\n3. Grill or sear over high heat: skirt steak 3–4 min per side to medium-rare; rest 5 min, slice against the grain. Serve with chimichurri.","id":"r6084112"},{"name":"Panko-crusted salmon","url":"https://www.foodnetwork.com/recipes/ina-garten/panko-crusted-salmon-recipe-2107225","serves":4,"ingredients":["Four 6–8 oz salmon fillets, skin on","⅔ cup panko","2 tbsp minced fresh parsley","1 tsp grated lemon zest","Kosher salt and pepper","2 tbsp olive oil","2 tbsp Dijon mustard","2 tbsp vegetable oil","Lemon wedges"],"steps":"1. Oven 425°F.\n2. Mix panko, parsley, lemon zest, ½ tsp salt, ½ tsp pepper; drizzle with olive oil and stir.\n3. Brush the tops of the fillets generously with mustard, salt and pepper, then press the panko mix on thickly.\n4. Vegetable oil in a 12-inch cast-iron on medium-high. Sear skin-side down 3–4 min without turning.\n5. Into the oven 5–7 min until the panko is browned. Cover with foil, rest 5–10 min. Lemon wedges.\nShortcut we use: skip the sear and just bake at 350°F for 15 min.","id":"ra0aa9e7"},{"name":"Black eyed pea curry with collard greens","url":"https://wellvegan.com/recipe/black-eyed-pea-curry-collard-greens","serves":4,"ingredients":["1 cup dry black eyed peas (or 2 cans, drained)","1 tbsp olive oil","¾ cup onion, diced","1 tbsp red curry paste","1 tsp fresh ginger, grated","2 garlic cloves, minced","2 (14 oz) cans diced tomatoes","¾ cup coconut milk","2 tsp cumin","¼ tsp cayenne","½ tsp salt","¼ tsp black pepper","1 cup collard greens, chopped","1 cup jasmine or brown rice, dry","Cilantro and naan, for serving"],"steps":"1. Soak dried peas overnight (or quick-soak: boil 2–3 min, cover, stand 60–90 min). Drain.\n2. Cover with fresh water, boil then simmer ~1 hr until tender. Drain. (Canned: skip 1–2.)\n3. Oil in a large skillet, onion 4–5 min. Curry paste, ginger, garlic 1–2 min.\n4. Tomatoes, coconut milk, cumin, cayenne, salt, pepper; whisk. Stir in collards and peas. Start the rice.\n5. Cover and simmer 20–30 min until collards are soft.\n6. Rice in bowls, curry on top, cilantro, naan on the side.","id":"r269e43a"},{"name":"Mediterranean white bean soup","url":"https://feelgoodfoodie.net/recipe/mediterranean-white-bean-soup/","serves":6,"ingredients":["1 tbsp olive oil","1 large onion, chopped","2 garlic cloves, minced","1 large carrot, chopped","1 celery rib, chopped","6 cups vegetable broth","1 tsp dried thyme","½ tsp oregano","1 tsp kosher salt","½ tsp black pepper","3 (15 oz) cans white beans, drained and rinsed","2 cups baby spinach","Fresh parsley and grated parmesan, for serving"],"steps":"1. Oil in a large pot over medium-high; onion 3–5 min until translucent. Garlic, carrot, celery, thyme, oregano, salt, pepper 2–3 min.\n2. Add broth and beans; bring to a boil, then simmer 15 min.\n3. Stir in spinach until wilted, ~2 min. Off heat.\n4. Parsley and parmesan on top.","id":"rb8e881f"},{"name":"Kimchi fried rice","url":"https://www.maangchi.com/recipe/kimchi-bokkeumbap","serves":3,"ingredients":["3 cups steamed rice","1 cup chopped kimchi (aged and sour)","¼ cup kimchi juice","¼ cup water","2–3 tbsp gochujang","3 tsp toasted sesame oil","1 tsp vegetable oil","1 green onion, chopped","1 tbsp roasted sesame seeds","1 sheet gim (roasted seaweed), shredded","Eggs — one fried dippy egg per portion"],"steps":"1. Wide pan on medium-high, vegetable oil.\n2. Kimchi, stir-fry 1 min.\n3. Rice, kimchi juice, water, gochujang. Stir ~7 min with a wooden spoon.\n4. Sesame oil, off the heat.\n5. Green onion, gim and sesame seeds on top. A dippy egg on each portion.","id":"rd31cdb8"}];

   <div class="pillrow"><button class="pill or" onclick="scramble()" ${busy?"disabled":""}>${I.dice} ${busy?"Thinking…":p.meals.some(Boolean)?"Fill empty days":"Build the week"}</button>

   ${groups.map(([a,items])=>`<div class="grp"><div class="gh"><span class="dot" style="background:${AC[a]}"></span>${a}<span class="cnt">${items.length}</span></div><div class="rows">${items.map(itemRow).join("")}</div></div>`).join("")}
   ${done.length?`<div class="grp"><div class="gh"><span class="dot" style="background:var(--gr)"></span>Checked off<span class="cnt">${done.length}</span></div><div class="rows">${done.map(itemRow).join("")}</div></div>`:""}
   ${open.length||done.length?`<div class="foot">
      <button class="btn" onclick="copyForChrome()">Send to ${esc(S.store)} with Claude in Chrome</button>
      <div class="split"><button class="btn sec" onclick="addStaples()">Add staples</button><button class="btn sec" onclick="sortAisles()" ${busy?"disabled":""}>Sort aisles</button>${done.length?`<button class="btn sec" onclick="L=L.filter(i=>!i.done);saveList();render()">Clear checked</button>`:""}</div>
      <p class="muted" style="margin:6px 0 0;text-align:center">Copies instructions you paste to Claude in Chrome on ${S.store==="Walmart"?"walmart.com":"giantfoodstores.com"}. You review and check out.</p></div>`:""}`;
  renderShop();
}
function dinnerLib(){const rn=S.recipes.map(r=>r.name);return [...new Set([...rn,...KNOWN])]}
function dragOver(e,el){e.preventDefault();el.classList.add("over")}
function dragDay(e,i){e.dataTransfer.setData("text/plain","day:"+i);e.dataTransfer.effectAllowed="move"}

function pickDayFor(name){sheet(`<h3>${esc(name)}</h3><p class="sub">Which day?</p><div class="chips">${DAYS.map((d,i)=>`<button class="chip ${S.plan.meals[i]?"":"on"}" onclick="setDayMeal(${i},${attr(name)});closeSheet()">${d}${S.plan.meals[i]?" · "+esc(S.plan.meals[i].name.slice(0,18)):""}</button>`).join("")}</div>`)}

function openAdd(){
  const sugg=[...S.staples,...freq().slice(0,12).map(x=>x.name)].filter((v,i,a)=>a.findIndex(x=>x.toLowerCase()===v.toLowerCase())===i).filter(n=>!L.some(i=>i.name.toLowerCase()===n.toLowerCase()&&!i.done)).slice(0,14);

const isStaple=n=>S.staples.some(s=>s.toLowerCase()===n.toLowerCase());
function toggleStaple(n){isStaple(n)?S.staples=S.staples.filter(s=>s.toLowerCase()!==n.toLowerCase()):S.staples.push(n);save()}
function addStaples(){if(!S.staples.length){toast("No staples yet — mark items ★ first");return}let n=0;S.staples.forEach(s=>{if(addItem(s,"staple"))n++});toast(n?`Added ${n} staples`:"Staples already on the list");render()}
async function sortAisles(){const items=L.filter(i=>!i.done&&!i.manualAisle);if(!items.length){toast("Nothing to sort");return}busy=true;render();
  try{const t=await ask("You sort grocery products into store aisles. Respond with JSON only.",`Aisles: ${AN.join(" | ")}. Return {"a":[[index,"Aisle"],...]} for every line.\n${items.map((i,k)=>k+". "+i.name).join("\n")}`);const j=parseJSON(t);(j.a||[]).forEach(([k,a])=>{if(items[k]&&AN.includes(a)){items[k].aisle=a;S.aisleMap[items[k].name.toLowerCase()]=a}});save();saveList();toast("Sorted")}catch(e){toast(e.message)}busy=false;render()}
function brandHint(name){const n=name.toLowerCase().split(/[\s,]+/).filter(w=>w.length>2);return freq().filter(x=>n.some(w=>x.name.toLowerCase().includes(w))).slice(0,2).map(h=>h.name).join(" or ")}
function copyForChrome(){const items=L.filter(i=>!i.done);if(!items.length){toast("List is empty");return}
  const lines=items.map(i=>{const b=brandHint(i.name);return `- ${i.name}${i.qty?" × "+i.qty:""}${b&&b.toLowerCase()!==i.name.toLowerCase()?` (we usually buy: ${b})`:""}`}).join("\n");
  const site=S.store==="Walmart"?"walmart.com":"giantfoodstores.com";
  const t=`On ${site} (I'm already signed in), add these grocery items to the cart for pickup. For each item: if a "we usually buy" brand is listed, choose that exact product; otherwise pick a well-rated family size${S.store==="Walmart"?", preferring Great Value when it's clearly cheaper":", preferring the store brand when it's clearly cheaper"}. Skip anything out of stock and tell me. Do not check out — stop when the cart is full and give me a summary with the cart total.\n\n${lines}`;

/* ================= PLAN (day sheet) ================= */
const hasIt=(x,g)=>(x.have||[]).some(h=>g.toLowerCase().includes(h.toLowerCase())||h.toLowerCase().includes(g.toLowerCase()));
const missing=x=>(x.ingredients||[]).filter(g=>!hasIt(x,g));
const PLAN_JSON=`{"meals":[{"day":"Mon","name":"","protein":"chicken|beef|pork|fish|veg","why":"≤10 words on which purchases it builds on","ingredients":["max 8 short items"],"have":["ingredients likely already on hand from recent purchases"]}]}`;
let dayQ="";
function openDay(i,q){const x=S.plan.meals[i];if(q!==undefined)dayQ=q;const ql=dayQ.trim().toLowerCase();
  const rn=new Set(S.recipes.map(r=>r.name.toLowerCase()));
  const opts=dinnerLib().filter(n=>!ql||n.toLowerCase().includes(ql)).sort((a,b)=>(rn.has(b.toLowerCase())-rn.has(a.toLowerCase()))||a.localeCompare(b)).slice(0,24);
  const r=x&&S.recipes.find(r=>r.id===x.recipeId||r.name.toLowerCase()===x.name.toLowerCase());
  sheet(`<h3>${DAYS[i]}${x?` · ${esc(x.name)}`:""}</h3><p class="sub">${busy?"Finding a recipe…":x?(r?"Recipe saved — ingredients below.":"No recipe yet for this one."):"Pick a common dinner, or type anything — if there's no recipe I'll find one."}</p>
    <input class="in" id="dayIn" placeholder="Type a dinner…" value="${esc(dayQ)}" enterkeyhint="done" oninput="dayQ=this.value;openDay(${i});const el=$('#dayIn');el.focus();el.setSelectionRange(el.value.length,el.value.length)" onkeydown="if(event.key==='Enter')chooseDay(${i},this.value)">
    <div class="chips" style="max-height:170px;overflow:auto">${opts.map(n=>`<button class="chip ${rn.has(n.toLowerCase())?"have":""}" onclick="chooseDay(${i},${attr(n)})">${esc(n)}</button>`).join("")||'<span class="muted" style="margin:0">Nothing matches — hit Enter to use what you typed.</span>'}</div>
    ${x?`<div class="chips">${(x.ingredients||[]).map(g=>`<span class="chip tag ${hasIt(x,g)?"have":""}">${esc(g)}</span>`).join("")}</div>
    <div class="split">${r?`<button class="btn" onclick="openRecipe('${r.id}')">Open recipe</button>`:`<button class="btn" onclick="findRecipeFor(${i})" ${busy?"disabled":""}>${busy?"Finding…":"Find the recipe"}</button>`}<button class="btn sec" onclick="closeSheet()">Done</button></div>
    <div class="split"><button class="btn sec" onclick="swapDay(${i})" ${busy?"disabled":""}>Pick for me</button><button class="btn dng" onclick="deleteDay(${i})">Delete ${DAYS[i]}</button></div>`
    :`<button class="btn sec" onclick="swapDay(${i})" ${busy?"disabled":""}>Pick for me from what we buy</button>`}`);
}
async function chooseDay(i,name){name=(name||"").trim();if(!name)return;dayQ="";
  const r=S.recipes.find(r=>r.name.toLowerCase()===name.toLowerCase());
  S.plan.meals[i]={day:DAYS[i],name:r?r.name:name,why:r?"from your recipes":"",ingredients:r?[...r.ingredients]:[],have:[],recipeId:r?r.id:undefined};
  if(!KNOWN.some(n=>n.toLowerCase()===name.toLowerCase()))KNOWN.push(name);save();
  if(r){openDay(i);return}
  await findRecipeFor(i);
}
async function findRecipeFor(i){if(busy)return;const x=S.plan.meals[i];if(!x)return;busy=true;openDay(i);
  try{const t=await ask("You find weeknight dinner recipes for a family of four. Prefer well-rated, simple recipes. Respond with JSON only — no citations, no prose.",
      `Find a good recipe for "${x.name}". Use web search. Return {"name":"${x.name.replace(/"/g,"'")}","ingredients":["shopping-style lines with amounts, max 14"],"steps":"numbered steps as plain text","url":"source page url","serves":4}`,{search:true});
    const j=parseJSON(t);const rec={id:uid(),name:x.name,ingredients:j.ingredients||[],steps:j.steps||"",url:j.url||"",serves:j.serves||4};
    S.recipes.push(rec);x.ingredients=[...rec.ingredients];x.recipeId=rec.id;x.why="found online";save();toast("Recipe saved to Recipes")}
  catch(e){toast("Couldn't find one: "+e.message)}
  busy=false;openDay(i);
}
function saveDay(i){const v=$("#dayIn").value.trim();if(!v)return deleteDay(i);const x=S.plan.meals[i];S.plan.meals[i]={day:DAYS[i],name:v,why:x&&x.name===v?x.why:"",ingredients:x&&x.name.toLowerCase()===v.toLowerCase()?x.ingredients:[],have:x?x.have:[],protein:x&&x.name.toLowerCase()===v.toLowerCase()?x.protein:guessProt(v)};save();closeSheet();toast("Saved")}
function deleteDay(i){S.plan.meals[i]=null;save();closeSheet();toast(`${DAYS[i]} cleared`)}
async function fillDay(i){if(busy)return;const x=S.plan.meals[i];const r=S.recipes.find(r=>r.name.toLowerCase()===x.name.toLowerCase());if(r&&r.ingredients.length){x.ingredients=[...r.ingredients];x.recipeId=r.id;x.why=x.why||"from your recipes";save();openDay(i);return}busy=true;openDay(i);
  try{const t=await ask(HOUSE(),`Give the grocery ingredients for a family dinner of "${x.name}" (skip pantry basics). JSON: {"ingredients":["max 8 short items"],"have":["those likely already on hand from recent purchases"],"why":"≤10 words"}`);const j=parseJSON(t);x.ingredients=j.ingredients||[];x.have=j.have||[];x.why=j.why||x.why;save()}catch(e){toast(e.message)}busy=false;openDay(i)}
async function swapDay(i){if(busy)return;busy=true;openDay(i);
  try{const others=S.plan.meals.filter((m,k)=>m&&k!==i).map(m=>m.name);const cur=S.plan.meals[i];
    const t=await ask(HOUSE(),`Pick ${DAYS[i]}'s dinner${cur?` (replacing "${cur.name}")`:""}: one meal built from what they buy, different from: ${[...others,...S.history.slice(-10)].join(", ")||"(none)"}. Seed ${uid()}. ${S.balanced?"Prefer a protein type not already used this week ("+["chicken","beef","pork","fish","veg"].filter(k=>!S.plan.meals.some((m,kk)=>m&&kk!==i&&protOf(m)===k)).join("/")+").":""} JSON: {"meal":{"day":"${DAYS[i]}","name":"","protein":"chicken|beef|pork|fish|veg","why":"","ingredients":[],"have":[]}}`);
    const j=parseJSON(t);if(!j.meal)throw new Error("Nothing came back.");S.plan.meals[i]=j.meal;save();toast("Picked")}catch(e){toast(e.message)}busy=false;openDay(i)}
function addMeal(i){const x=S.plan.meals[i];let n=0;missing(x).forEach(g=>{if(addItem(g,x.name))n++});toast(`Added ${n} items`)}
function addWeek(){let n=0;S.plan.meals.filter(Boolean).forEach(x=>missing(x).forEach(g=>{if(addItem(g,x.name))n++}));toast(n?`Added ${n} items for the week`:"Nothing missing — fill ingredients first");render()}
async function scramble(redo){if(busy)return;busy=true;render();
  try{const keep=redo?[]:S.plan.meals.map((m,i)=>m?i:-1).filter(i=>i>=0);const fill=DAYS.map((_,i)=>i).filter(i=>!keep.includes(i));
    if(!fill.length){toast("All five days are set");busy=false;render();return}
    const prev=S.plan.meals.filter(Boolean).map(m=>m.name);const avoid=[...new Set([...prev,...S.history.slice(-10)])];
    const t=await ask(HOUSE(),`Build dinners for ${fill.map(i=>DAYS[i]).join(", ")} (${fill.length} meal${fill.length>1?"s":""}). ${keep.length?"Already set — complement them, vary proteins, don't repeat: "+keep.map(i=>DAYS[i]+" "+S.plan.meals[i].name).join("; ")+".":""} Every meal must be built mostly from things this family demonstrably buys; name meals using their known-dinner list where it fits. ${S.balanced?"Protein mix for the week: cover chicken, beef, pork, fish and one veggie night — one each across Mon–Fri"+(keep.length?" (already covered: "+keep.map(i=>protOf(S.plan.meals[i])).filter(Boolean).join(", ")+")":"")+".":"Vary proteins."} ${S.newDish&&fill.length>=3?"Exactly one should be a NEW dish they've never listed, still built from what they buy.":"No new dishes."} Do not use any of: ${avoid.join(", ")||"(none)"}. Seed: ${uid()}. JSON: ${PLAN_JSON} (only the requested days)`);
    const j=parseJSON(t);const got=j.meals||[];if(!got.length)throw new Error("No meals came back — try again.");
    if(redo&&prev.length)S.history=[...S.history,...prev].slice(-30);
    fill.forEach((di,k)=>{const m=got.find(x=>String(x.day||"").slice(0,3).toLowerCase()===DAYS[di].toLowerCase())||got[k];if(m){const r=S.recipes.find(r=>r.name.toLowerCase()===String(m.name).toLowerCase());S.plan.meals[di]={day:DAYS[di],name:r?r.name:m.name,protein:PROT[m.protein]?m.protein:guessProt(m.name),why:m.why||"",ingredients:r?[...r.ingredients]:(m.ingredients||[]),have:m.have||[],recipeId:r?r.id:undefined}}});
    S.plan.weekOf=today();save()}catch(e){toast(e.message)}busy=false;render()}

function ingestOrdersJSON(txt){let j;try{j=JSON.parse(txt)}catch(e){return null}
  let orders=Array.isArray(j)?j:(j.orders||j.data||j.results||j.items||null);if(!orders||!Array.isArray(orders))return null;

  const seen=new Set(S.purchases.map(p=>p.date+"|"+String(p.name).toLowerCase()+"|"+p.store+"|"+(p.oid||"")));let n=0,skip=0;
  orders.forEach(o=>{const inv=o.invoice||o.details||o;const oid=String(pick(o,"orderNumber","order_number","orderId","order_id","id","Order Number")||"");
    let ds=pick(o,"orderDate","order_date","date","placedAt","Order Date")||pick(inv,"orderDate","date")||"";ds=String(ds).replace(/ purchase/i,"");let d=new Date(ds);if(isNaN(d))return;const date=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
    const items=pick(inv,"items","lineItems","products","Items")||pick(o,"items","lineItems","products")||[];
    items.forEach(it=>{const name=String(pick(it,"name","productName","product_name","title","Product Name")||"").trim();if(!name||/^rx#/i.test(name))return;
      const qty=Math.max(1,parseInt(pick(it,"quantity","qty","Quantity"))||1);let price=parseFloat(String(pick(it,"price","linePrice","total","Price")||"").replace(/[$,]/g,""))||0;
      const key=date+"|"+name.toLowerCase()+"|Walmart|"+oid;if(seen.has(key)){skip++;return}seen.add(key);S.purchases.push({name,store:"Walmart",date,qty,price,oid});n++})});

function parseCSV(t){const rows=[];let row=[],cur="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else{if(c==='"')q=true;else if(c===","){row.push(cur);cur=""}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}else cur+=c}}if(cur||row.length){row.push(cur);rows.push(row)}return rows}
function ingestRows(rows){
  if(!rows.length)throw new Error("Empty file");const H=rows[0].map(h=>String(h||"").toLowerCase().trim());
  const col=(...names)=>{for(const n of names){const i=H.findIndex(h=>h===n||h.includes(n));if(i>=0)return i}return -1};
  const cN=col("product name","product","item","name"),cD=col("order date","date"),cQ=col("quantity","qty"),cP=col("price","total"),cS=col("fulfillment","store"),cO=col("order number","order");
  if(cN<0||cD<0)throw new Error("Couldn't find product/date columns");
  const seen=new Set(S.purchases.map(p=>p.date+"|"+p.name.toLowerCase()+"|"+p.store+"|"+(p.oid||"")));let n=0,skip=0;
  rows.slice(1).forEach(r=>{const name=String(r[cN]||"").trim();if(!name||/^rx#/i.test(name))return;
    let ds=String(r[cD]||"").replace(/ purchase/i,"").trim();let d=new Date(ds);if(isNaN(d))return;const date=new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
    const qty=Math.max(1,parseInt(r[cQ])||1),price=parseFloat(String(r[cP]||"").replace(/[$,]/g,""))||0,oid=cO>=0?String(r[cO]||""):"";
    const key=date+"|"+name.toLowerCase()+"|Walmart|"+oid;if(seen.has(key)){skip++;return}seen.add(key);
    S.purchases.push({name,store:"Walmart",date,qty,price,oid});n++});
  save();return {n,skip};
}
async function importFile(file){if(!file)return;toast("Reading "+file.name+"…");

      const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:"array"});const sh=wb.SheetNames.includes("Items")?"Items":wb.SheetNames[0];rows=XLSX.utils.sheet_to_json(wb.Sheets[sh],{header:1,raw:false})}
    else rows=parseCSV(await file.text());
    const r=ingestRows(rows);toast(`Imported ${r.n} Walmart items${r.skip?` (${r.skip} already there)`:""}`);render()}
  catch(e){toast(e.message)}}

function putInWeek(k,i){const x=out[k].meals[i];const e=S.plan.meals.findIndex(m=>!m);const d=e>=0?e:4;S.plan.meals[d]={day:DAYS[d],name:x.name,protein:protOf(x),why:x.why||"",ingredients:x.ingredients||[],have:[]};save();toast(`Set for ${DAYS[d]}`);tab="home";render()}
async function runSuggest(){if(busy)return;busy=true;out.sugPref=$("#sugPref").value.trim();render();try{const t=await ask(HOUSE(),`Suggest 5 new weeknight dinners NOT in the known list, that fit how this family shops and cooks. ${out.sugPref?"Constraint: "+out.sugPref+".":""} JSON: {"meals":[{"name":"","why":"one short sentence tying it to what they buy","ingredients":["max 8 short items"]}]}`);out.suggest=parseJSON(t)}catch(e){toast(e.message)}busy=false;render()}
async function runLeft(){if(busy)return;const inp=$("#leftIn").value.trim();if(!inp){toast("Add a few ingredients first");return}busy=true;out.leftIn=inp;render();try{const t=await ask(HOUSE(),`Ingredients on hand: ${inp}\nPropose up to 4 dinners that use most of these. "ingredients" = ONLY what still needs buying (max 6). JSON: {"meals":[{"name":"","why":"which leftovers it uses","ingredients":[]}]}`);out.leftovers=parseJSON(t)}catch(e){toast(e.message)}busy=false;render()}
function dealsHTML(d){return `${(d.deals||[]).length?`<div class="card"><h4>On sale</h4>${d.deals.map(x=>`<div class="deal"><span>${esc(x.item)} <span style="color:var(--ink3);font-size:12px">${esc(x.store||"")}</span></span><b>${esc(x.price||"")}</b></div>`).join("")}</div>`:""}${cards(d.meals||[],"deals")}${d.note?`<p class="muted">${esc(d.note)}</p>`:""}`}
async function runDeals(){if(busy)return;busy=true;const pasted=$("#adText").value.trim();render();const stores=[S.stores.giant&&"Giant Food (giantfoodstores.com)",S.stores.walmart&&"Walmart"].filter(Boolean).join(" and ");const J=`JSON: {"deals":[{"item":"","price":"","store":""}],"meals":[{"name":"","why":"","ingredients":["max 8"],"onSale":["ingredient words matching a sale"]}],"note":""}`;
  try{const t=await ask(HOUSE()+" Put everything in the JSON; no citations.",pasted?`Weekly ad items:\n${pasted.slice(0,5000)}\n\nPick up to 5 dinners this family would plausibly make whose main ingredients are on sale here. ${J}`:`Use web search to find THIS WEEK's sale items at ${stores} near ${S.area||"Green Lane, PA"} (meat, seafood, produce, pantry). Then pick up to 5 dinners this family would plausibly make whose main ingredients are on sale. If you can't find the ad, say so in "note". ${J}`,{search:!pasted});out.deals=parseJSON(t)}catch(e){toast(e.message)}busy=false;render()}

/* ================= SETTINGS ================= */
function openSettings(){
  sheet(`<h3>Settings</h3><p class="sub">Foodie · household</p>
    ${HOSTED?`<div class="kv"><div>Household sync<small>${cloudOK?"Connected — both phones see the same list and plan":"Not connected — check passcode / Supabase settings"}</small></div><button class="btn sec" style="width:auto;margin:0;min-height:38px;padding:6px 12px" onclick="localStorage.removeItem('foodie:pass');PASS=null;askPass()">Passcode</button></div>`:`<div class="kv"><div>Shared list<small>Jerusha sees and checks off the same list</small></div><button class="sw ${S.shared?"on":""}" onclick="toggleShared()" aria-label="Shared list"></button></div>`}
    <div class="kv"><div>Default store<small>Where you shop and send the cart</small></div><div class="chips" style="margin:0">${["Walmart","Giant"].map(s=>`<button class="chip ${S.store===s?"on":""}" onclick="S.store='${s}';save();openSettings()">${s}</button>`).join("")}</div></div>
    <div class="kv"><div>One new dish a week<small>When building the week</small></div><button class="sw ${S.newDish?"on":""}" onclick="S.newDish=!S.newDish;save();openSettings()" aria-label="New dish"></button></div>
    <div class="sec" style="padding:12px 0 6px"><h2 style="font-size:15px">Household notes</h2></div>
    <textarea class="in" placeholder="e.g. one kid won't eat mushrooms; Thursdays need to be 20 minutes" onchange="S.notes=this.value;save()">${esc(S.notes)}</textarea>
    <div class="sec" style="padding:12px 0 6px"><h2 style="font-size:15px">Staples (${S.staples.length})</h2></div>
    <div class="chips" style="margin-top:0">${S.staples.map(s=>`<button class="chip" onclick="toggleStaple(${attr(s)});openSettings()">${esc(s)} ×</button>`).join("")||'<span class="muted" style="margin:0">Mark items ★ in Pantry or from the ··· menu on an item.</span>'}</div>
    <div class="sec" style="padding:12px 0 6px"><h2 style="font-size:15px">Backup</h2></div>
    <div class="split"><button class="btn sec" onclick="exportState()">Export</button><label class="btn sec" style="display:flex;align-items:center;justify-content:center" for="stateIn">Import</label><input type="file" id="stateIn" accept=".json" onchange="importState(this.files[0])"></div>
    <p class="muted" style="margin:10px 0 0">${storageOK===false?"Saving isn't available in this viewer, so changes last for this session only — Export before you close, Import next time. ":""}When the list is shared, anyone who opens this app sees it. Everything else stays private to you.</p>
    <button class="btn" onclick="closeSheet()">Done</button>`);
}
function exportState(){const blob=new Blob([JSON.stringify({state:S,list:L,exported:new Date().toISOString()})],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="foodie-backup-"+today()+".json";a.click();toast("Backup downloaded")}
async function importState(file){if(!file)return;try{const j=JSON.parse(await file.text());if(j.state){S=j.state;for(const k in SEED)if(S[k]===undefined)S[k]=JSON.parse(JSON.stringify(SEED[k]));KNOWN=S.known||KNOWN}if(j.list)L=j.list;save();saveList();toast("Backup restored");closeSheet()}catch(e){toast("Couldn't read that backup")}}
async function toggleShared(){const old=[...L];S.shared=!S.shared;save();await loadList();if(S.shared&&!L.length&&old.length){L=old;saveList()}toast(S.shared?"List is now shared":"List is private");openSettings()}

async function boot(){try{await load();render();if(HOSTED){setInterval(refreshList,20000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshList()})}}catch(e){if(e.message==="passcode"){S=S||JSON.parse(JSON.stringify(SEED));askPass()}else{console.error(e);toast(e.message)}}}
boot();
</script>
</body>
</html>
